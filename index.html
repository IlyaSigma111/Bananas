<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Своя игра: Мир бананов</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: 'Comic Sans MS', 'Georgia', serif;
            background: radial-gradient(circle at center, #fffaaf, #d3c616);
            color: #3e2c20;
        }

        .app-container {
            display: flex; flex-direction: column; height: 100vh; width: 100vw; padding: 1vh 1vw;
        }

        h1 {
            margin: 0 0 1vh 0; font-size: clamp(2rem, 6vh, 5rem); color: #b8860b;
            text-align: center; border-bottom: 4px dashed #b8860b; padding-bottom: 1vh;
            text-shadow: 2px 2px 0 #fff;
        }

        .scoreboard {
            width: 100%; background: #fff8dc; border: 4px solid #b8860b;
            border-radius: 20px; padding: 1vh; margin-bottom: 1vh; text-align: center;
        }
        .scoreboard p { font-size: clamp(2rem, 6vh, 4rem); margin: 0; color: #b8860b; line-height: 1; }
        .scoreboard-label { font-size: 1.2rem; text-transform: uppercase; font-weight: bold; }

        .board-wrapper { flex-grow: 1; width: 100%; display: flex; justify-content: center; overflow: hidden; }
        .board {
            display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: auto repeat(5, 1fr);
            gap: clamp(5px, 1vh, 15px); width: 100%; height: 100%;
        }

        .header {
            background: linear-gradient(145deg, #ffd700, #daa520); border: 3px solid #b8860b;
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(1rem, 3vh, 2.5rem); font-weight: bold; border-radius: 20px;
            padding: 10px; text-align: center;
        }

        .cell {
            background: linear-gradient(145deg, #fffb90, #ffe135); border: 4px solid #b8860b;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: clamp(2rem, 8vh, 6rem); font-weight: bold; color: #3e2c20;
            border-radius: 20px; transition: 0.2s; box-shadow: 0 6px 0 #b8860b;
        }
        .cell:hover { background: #ffe135; transform: translateY(-3px); }
        .cell.answered { background: #e0e0e0; color: #999; cursor: default; pointer-events: none; border-color: #999; box-shadow: none; }

        /* Модальное окно */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center;
            z-index: 100; padding: 2vh 2vw;
        }

        .modal {
            background: #fff8dc; color: #3e2c20; width: 95%; max-width: 1200px; height: 80vh;
            border-radius: 30px; padding: 3vh; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 12px solid #b8860b; display: flex; flex-direction: column;
            align-items: center; text-align: center; transform: scale(0.8); transition: 0.3s;
        }
        .modal.show { transform: scale(1); }

        .modal-category { font-size: clamp(1.5rem, 4vh, 3rem); color: #b8860b; margin-bottom: 1vh; }
        .modal-price { font-size: clamp(2rem, 6vh, 5rem); color: #3e2c20; font-weight: bold; margin-bottom: 2vh; }
        .modal-content {
            font-size: clamp(2rem, 7vh, 5rem); line-height: 1.4; flex-grow: 1; display: flex;
            align-items: center; justify-content: center; width: 100%; word-wrap: break-word;
        }

        .modal-btn {
            background: #b8860b; color: #fff; border: none; padding: 2vh 4vw;
            font-size: clamp(1.5rem, 4vh, 3rem); border-radius: 20px; cursor: pointer; transition: 0.2s;
        }
        .modal-btn:hover { background: #daa520; }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>Своя игра: Великий Банановый Путь</h1>
        <div class="scoreboard">
            <div class="scoreboard-label">Общий Счёт</div>
            <p id="totalScore">0</p>
        </div>
        <div class="board-wrapper">
            <div class="board" id="gameBoard"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-category" id="modalCategory"></div>
            <div class="modal-price" id="modalPrice"></div>
            <div class="modal-content" id="modalContent"></div>
            <button class="modal-btn" id="modalBtn" onclick="showAnswer()">Показать ответ</button>
        </div>
    </div>

    <script>
        const gameData = [
            {
                category: "Банановая эволюция",
                questions: [
                    { q: "От какого животного, по мнению учёных, произошли бананы?", a: "От динозавров", pts: 100 },
                    { q: "Что кричит обезьяна, когда у неё отбирают банан?", a: "«Верни!»", pts: 200 },
                    { q: "Почему банан желтый?", a: "Чтобы его было видно в темноте", pts: 300 },
                    { q: "Кто главный враг банана?", a: "Ленивец", pts: 400 },
                    { q: "Сколько бананов может съесть один человек за раз?", a: "Сколько влезет", pts: 500 }
                ]
            },
            {
                category: "Банановая география",
                questions: [
                    { q: "Какая страна является мировой столицей бананов?", a: "Эквадор", pts: 100 },
                    { q: "На каком материке бананы не растут, а только лежат на складе?", a: "Антарктида", pts: 200 },
                    { q: "Как называется остров, где бананы созревают быстрее всех?", a: "Бананland", pts: 300 },
                    { q: "Что является главной достопримечательностью города Бананово?", a: "Памятник кожуре", pts: 400 },
                    { q: "Какая страна первой отправила банан в космос?", a: "Никакая, он сам улетел", pts: 500 }
                ]
            },
            {
                category: "Банановая техника",
                questions: [
                    { q: "Какой механизм нужен, чтобы очистить банан?", a: "Руки", pts: 100 },
                    { q: "Что изобрели, чтобы банан не темнел?", a: "Скотч", pts: 200 },
                    { q: "Как называется устройство для транспортировки бананов?", a: "Грузовик", pts: 300 },
                    { q: "Что будет, если уронить банан в микроволновку?", a: "Банановый взрыв", pts: 400 },
                    { q: "Какой двигатель лучше всего работает на бананах?", a: "Обезьяний", pts: 500 }
                ]
            },
            {
                category: "Банановое общество",
                questions: [
                    { q: "Кто главный в банановой иерархии?", a: "Король Банан I", pts: 100 },
                    { q: "Как называется рабочий класс, который собирает бананы?", a: "Бананщики", pts: 200 },
                    { q: "Что носят на голове банановые магнаты?", a: "Корону из кожуры", pts: 300 },
                    { q: "Какой закон нельзя нарушать в банановом обществе?", a: "Не есть последний банан", pts: 400 },
                    { q: "Какая партия правит в стране Банании?", a: "Партия Жёлтых", pts: 500 }
                ]
            },
            {
                category: "Банановый национализм",
                questions: [
                    { q: "Как называется любовь к бананам своей родины?", a: "Бананизм", pts: 100 },
                    { q: "Что делают с врагами бананов?", a: "Кидают кожуру", pts: 200 },
                    { q: "Какое животное является символом бананового пацифизма?", a: "Ленивец (мирно висит)", pts: 300 },
                    { q: "Как называется мирный договор между бананами и яблоками?", a: "Фруктовый пакт", pts: 400 },
                    { q: "Против кого объединились все бананы мира?", a: "Против котиков", pts: 500 }
                ]
            }
        ];

        let totalScore = 0;
        let currentQuestion = null;
        let currentCell = null;

        function initBoard() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';
            gameData.forEach(cat => {
                const header = document.createElement('div');
                header.className = 'header';
                header.textContent = cat.category;
                board.appendChild(header);
            });

            for (let ptsIndex = 0; ptsIndex < 5; ptsIndex++) {
                gameData.forEach((cat, catIndex) => {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.textContent = cat.questions[ptsIndex].pts;
                    cell.onclick = () => openQuestion(catIndex, ptsIndex, cell);
                    board.appendChild(cell);
                });
            }
        }

        function openQuestion(catIndex, ptsIndex, cell) {
            currentQuestion = gameData[catIndex].questions[ptsIndex];
            currentCell = cell;
            
            document.getElementById('modalCategory').textContent = gameData[catIndex].category;
            document.getElementById('modalPrice').textContent = currentQuestion.pts + " очков";
            document.getElementById('modalContent').textContent = currentQuestion.q;
            
            const btn = document.getElementById('modalBtn');
            btn.textContent = "Показать ответ";
            btn.onclick = showAnswer;
            
            document.getElementById('modalOverlay').style.display = 'flex';
            setTimeout(() => document.querySelector('.modal').classList.add('show'), 10);
        }

        function showAnswer() {
            if (!currentQuestion) return;
            document.getElementById('modalContent').textContent = "ОТВЕТ: " + currentQuestion.a;
            
            const btn = document.getElementById('modalBtn');
            btn.textContent = "Верно! + " + currentQuestion.pts;
            btn.onclick = awardPoints;
        }

        function awardPoints() {
            totalScore += currentQuestion.pts;
            document.getElementById('totalScore').textContent = totalScore;
            
            currentCell.classList.add('answered');
            currentCell.onclick = null;
            closeModal();
        }

        function closeModal() {
            document.querySelector('.modal').classList.remove('show');
            document.getElementById('modalOverlay').style.display = 'none';
            setTimeout(() => { currentQuestion = null; currentCell = null; }, 300);
        }

        window.onload = initBoard;
    </script>
</body>
</html>
