<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Своя игра: Мир яблок</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: 'Comic Sans MS', 'Georgia', serif;
            background: radial-gradient(circle at center, #fff5e6, #d35400);
            color: #3e2c20;
        }

        .app-container {
            display: flex; flex-direction: column; height: 100vh; width: 100vw; padding: 1vh 1vw;
        }

        h1 {
            margin: 0 0 1vh 0; font-size: clamp(2rem, 6vh, 5rem); color: #8b0000;
            text-align: center; border-bottom: 4px dashed #8b0000; padding-bottom: 1vh;
            text-shadow: 2px 2px 0 #fff;
        }

        .scoreboard {
            width: 100%; background: #fff8dc; border: 4px solid #8b0000;
            border-radius: 20px; padding: 1vh; margin-bottom: 1vh; text-align: center;
        }
        .scoreboard p { font-size: clamp(2rem, 6vh, 4rem); margin: 0; color: #8b0000; line-height: 1; }
        .scoreboard-label { font-size: 1.2rem; text-transform: uppercase; font-weight: bold; }

        .board-wrapper { flex-grow: 1; width: 100%; display: flex; justify-content: center; overflow: hidden; }
        .board {
            display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: auto repeat(5, 1fr);
            gap: clamp(5px, 1vh, 15px); width: 100%; height: 100%;
        }

        .header {
            background: linear-gradient(145deg, #ff6347, #dc143c); border: 3px solid #8b0000;
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(1rem, 3vh, 2.5rem); font-weight: bold; border-radius: 20px;
            padding: 10px; text-align: center;
        }

        .cell {
            background: linear-gradient(145deg, #fffacd, #ffb6c1); border: 4px solid #8b0000;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: clamp(2rem, 8vh, 6rem); font-weight: bold; color: #3e2c20;
            border-radius: 20px; transition: 0.2s; box-shadow: 0 6px 0 #8b0000;
        }
        .cell:hover { background: #ffb6c1; transform: translateY(-3px); }
        .cell.answered { background: #e0e0e0; color: #999; cursor: default; pointer-events: none; border-color: #999; box-shadow: none; }

        /* Модальное окно */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center;
            z-index: 100; padding: 2vh 2vw;
        }

        .modal {
            background: #fff8dc; color: #3e2c20; width: 95%; max-width: 1200px; height: 80vh;
            border-radius: 30px; padding: 3vh; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 12px solid #8b0000; display: flex; flex-direction: column;
            align-items: center; text-align: center; transform: scale(0.8); transition: 0.3s;
        }
        .modal.show { transform: scale(1); }

        .modal-category { font-size: clamp(1.5rem, 4vh, 3rem); color: #8b0000; margin-bottom: 1vh; }
        .modal-price { font-size: clamp(2rem, 6vh, 5rem); color: #3e2c20; font-weight: bold; margin-bottom: 2vh; }
        .modal-content {
            font-size: clamp(2rem, 7vh, 5rem); line-height: 1.4; flex-grow: 1; display: flex;
            align-items: center; justify-content: center; width: 100%; word-wrap: break-word;
        }

        .modal-btn {
            background: #8b0000; color: #fff; border: none; padding: 2vh 4vw;
            font-size: clamp(1.5rem, 4vh, 3rem); border-radius: 20px; cursor: pointer; transition: 0.2s;
        }
        .modal-btn:hover { background: #dc143c; }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>Своя игра: Яблочный переворот</h1>
        <div class="scoreboard">
            <div class="scoreboard-label">Общий Счёт</div>
            <p id="totalScore">0</p>
        </div>
        <div class="board-wrapper">
            <div class="board" id="gameBoard"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-category" id="modalCategory"></div>
            <div class="modal-price" id="modalPrice"></div>
            <div class="modal-content" id="modalContent"></div>
            <button class="modal-btn" id="modalBtn" onclick="showAnswer()">Показать ответ</button>
        </div>
    </div>

    <script>
        const gameData = [
            {
                category: "Яблочная эволюция",
                questions: [
                    { q: "От какого животного произошло яблоко?", a: "От ёжика", pts: 100 },
                    { q: "Кто первым попробовал яблоко?", a: "Адам", pts: 200 },
                    { q: "Почему яблоко красное?", a: "Чтобы его было видно на снегу", pts: 300 },
                    { q: "Что будет, если скрестить яблоко и апельсин?", a: "Яблоко в апельсиновой кожуре", pts: 400 },
                    { q: "Какого цвета яблоко на самом деле?", a: "Все цвета радуги", pts: 500 }
                ]
            },
            {
                category: "Яблочная география",
                questions: [
                    { q: "Какая страна является родиной яблок?", a: "Казахстан", pts: 100 },
                    { q: "Где растут яблоки лучше всего?", a: "На яблоне", pts: 200 },
                    { q: "Какой город является яблочной столицей мира?", a: "Алматы", pts: 300 },
                    { q: "Что лежит под яблоней?", a: "Земля", pts: 400 },
                    { q: "На каком острове яблоки едят в супе?", a: "На острове Джонсона", pts: 500 }
                ]
            },
            {
                category: "Яблочная техника",
                questions: [
                    { q: "Какой механизм нужен, чтобы очистить яблоко?", a: "Нож", pts: 100 },
                    { q: "Что изобрели, чтобы яблоко не темнело?", a: "Лимонную кислоту", pts: 200 },
                    { q: "Как называется устройство для добычи сока?", a: "Соковыжималка", pts: 300 },
                    { q: "Что будет, если засунуть яблоко в розетку?", a: "Яблочный ток", pts: 400 },
                    { q: "Какой двигатель лучше всего работает на яблоках?", a: "Сироповый", pts: 500 }
                ]
            },
            {
                category: "Яблочное общество",
                questions: [
                    { q: "Кто главный в яблочной иерархии?", a: "Король Яблоко I", pts: 100 },
                    { q: "Как называется рабочий класс, который собирает яблоки?", a: "Яблочники", pts: 200 },
                    { q: "Что носят на голове яблочные магнаты?", a: "Корону из листьев", pts: 300 },
                    { q: "Какой закон нельзя нарушать в яблочном обществе?", a: "Не есть червивое яблоко", pts: 400 },
                    { q: "Какая партия правит в стране Яблонезии?", a: "Партия Красных", pts: 500 }
                ]
            },
            {
                category: "Яблочный национализм",
                questions: [
                    { q: "Как называется любовь к яблокам своей родины?", a: "Яблонизм", pts: 100 },
                    { q: "Что делают с врагами яблок?", a: "Моют и чистят", pts: 200 },
                    { q: "Какое животное является символом яблочного пацифизма?", a: "Червяк (мирно живёт внутри)", pts: 300 },
                    { q: "Как называется мирный договор между яблоками и грушами?", a: "Фруктовый пакт", pts: 400 },
                    { q: "Против кого объединились все яблоки мира?", a: "Против бананов", pts: 500 }
                ]
            }
        ];

        let totalScore = 0;
        let currentQuestion = null;
        let currentCell = null;

        function initBoard() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';
            gameData.forEach(cat => {
                const header = document.createElement('div');
                header.className = 'header';
                header.textContent = cat.category;
                board.appendChild(header);
            });

            for (let ptsIndex = 0; ptsIndex < 5; ptsIndex++) {
                gameData.forEach((cat, catIndex) => {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.textContent = cat.questions[ptsIndex].pts;
                    cell.onclick = () => openQuestion(catIndex, ptsIndex, cell);
                    board.appendChild(cell);
                });
            }
        }

        function openQuestion(catIndex, ptsIndex, cell) {
            currentQuestion = gameData[catIndex].questions[ptsIndex];
            currentCell = cell;
            
            document.getElementById('modalCategory').textContent = gameData[catIndex].category;
            document.getElementById('modalPrice').textContent = currentQuestion.pts + " очков";
            document.getElementById('modalContent').textContent = currentQuestion.q;
            
            const btn = document.getElementById('modalBtn');
            btn.textContent = "Показать ответ";
            btn.onclick = showAnswer;
            
            document.getElementById('modalOverlay').style.display = 'flex';
            setTimeout(() => document.querySelector('.modal').classList.add('show'), 10);
        }

        function showAnswer() {
            if (!currentQuestion) return;
            document.getElementById('modalContent').textContent = "ОТВЕТ: " + currentQuestion.a;
            
            const btn = document.getElementById('modalBtn');
            btn.textContent = "Верно! + " + currentQuestion.pts;
            btn.onclick = awardPoints;
        }

        function awardPoints() {
            totalScore += currentQuestion.pts;
            document.getElementById('totalScore').textContent = totalScore;
            
            currentCell.classList.add('answered');
            currentCell.onclick = null;
            closeModal();
        }

        function closeModal() {
            document.querySelector('.modal').classList.remove('show');
            document.getElementById('modalOverlay').style.display = 'none';
            setTimeout(() => { currentQuestion = null; currentCell = null; }, 300);
        }

        window.onload = initBoard;
    </script>
</body>
</html>
