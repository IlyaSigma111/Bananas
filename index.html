<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Своя игра: Фруктовый микс</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: 'Comic Sans MS', 'Georgia', serif;
            background: radial-gradient(circle at center, #fff5e6, #e67e22);
            color: #2c3e50;
        }

        .app-container {
            display: flex; flex-direction: column; height: 100vh; width: 100vw; padding: 1vh 1vw;
        }

        h1 {
            margin: 0 0 1vh 0; font-size: clamp(2rem, 6vh, 5rem); color: #8e44ad;
            text-align: center; border-bottom: 4px dashed #8e44ad; padding-bottom: 1vh;
            text-shadow: 2px 2px 0 #fff;
        }

        .scoreboard {
            width: 100%; background: #fdf2e9; border: 4px solid #8e44ad;
            border-radius: 20px; padding: 1vh; margin-bottom: 1vh; text-align: center;
        }
        .scoreboard p { font-size: clamp(2rem, 6vh, 4rem); margin: 0; color: #8e44ad; line-height: 1; }
        .scoreboard-label { font-size: 1.2rem; text-transform: uppercase; font-weight: bold; }

        .board-wrapper { flex-grow: 1; width: 100%; display: flex; justify-content: center; overflow: hidden; }
        .board {
            display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: auto repeat(5, 1fr);
            gap: clamp(5px, 1vh, 15px); width: 100%; height: 100%;
        }

        .header {
            background: linear-gradient(145deg, #f39c12, #d35400); border: 3px solid #8e44ad;
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(1rem, 3vh, 2.5rem); font-weight: bold; border-radius: 20px;
            padding: 10px; text-align: center;
        }

        .cell {
            background: linear-gradient(145deg, #fdf2e9, #fad7a1); border: 4px solid #8e44ad;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: clamp(2rem, 8vh, 6rem); font-weight: bold; color: #2c3e50;
            border-radius: 20px; transition: 0.2s; box-shadow: 0 6px 0 #8e44ad;
        }
        .cell:hover { background: #fad7a1; transform: translateY(-3px); }
        .cell.answered { background: #e0e0e0; color: #999; cursor: default; pointer-events: none; border-color: #999; box-shadow: none; }

        /* Модальное окно */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center;
            z-index: 100; padding: 2vh 2vw;
        }

        .modal {
            background: #fdf2e9; color: #2c3e50; width: 95%; max-width: 1200px; height: 80vh;
            border-radius: 30px; padding: 3vh; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 12px solid #8e44ad; display: flex; flex-direction: column;
            align-items: center; text-align: center; transform: scale(0.8); transition: 0.3s;
        }
        .modal.show { transform: scale(1); }

        .modal-category { font-size: clamp(1.5rem, 4vh, 3rem); color: #8e44ad; margin-bottom: 1vh; }
        .modal-price { font-size: clamp(2rem, 6vh, 5rem); color: #2c3e50; font-weight: bold; margin-bottom: 2vh; }
        .modal-content {
            font-size: clamp(2rem, 7vh, 5rem); line-height: 1.4; flex-grow: 1; display: flex;
            align-items: center; justify-content: center; width: 100%; word-wrap: break-word;
        }

        .modal-btn {
            background: #8e44ad; color: #fff; border: none; padding: 2vh 4vw;
            font-size: clamp(1.5rem, 4vh, 3rem); border-radius: 20px; cursor: pointer; transition: 0.2s;
        }
        .modal-btn:hover { background: #9b59b6; }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>Своя игра: Фруктовый сад</h1>
        <div class="scoreboard">
            <div class="scoreboard-label">Общий Счёт</div>
            <p id="totalScore">0</p>
        </div>
        <div class="board-wrapper">
            <div class="board" id="gameBoard"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-category" id="modalCategory"></div>
            <div class="modal-price" id="modalPrice"></div>
            <div class="modal-content" id="modalContent"></div>
            <button class="modal-btn" id="modalBtn" onclick="showAnswer()">Показать ответ</button>
        </div>
    </div>

    <script>
        const gameData = [
            {
                category: "Цитрусовые",
                questions: [
                    { q: "Почему лимон кислый, а апельсин сладкий, хотя они родственники?", a: "Потому что у лимона плохое чувство юмора", pts: 100 },
                    { q: "Какой цитрус помогает не болеть, но при этом его все боятся?", a: "Лимон (боятся, что он кислый)", pts: 200 },
                    { q: "Что будет, если апельсин подрастёт до размеров арбуза?", a: "Фруктовый мяч", pts: 300 },
                    { q: "Назовите самый тёплый цитрус.", a: "Грейпфрут (он греет руки в кармане)", pts: 400 },
                    { q: "Что делает лайм, когда его никто не видит?", a: "Танцует с лимоном в текиле", pts: 500 }
                ]
            },
            {
                category: "Косточковые",
                questions: [
                    { q: "Что общего у сливы, персика и абрикоса?", a: "Они делят одну косточку на троих", pts: 100 },
                    { q: "Какая косточка самая вредная?", a: "Вишнёвая (её нельзя есть)", pts: 200 },
                    { q: "Почему персик пушистый?", a: "Чтобы его было видно в темноте", pts: 300 },
                    { q: "Какой фрукт с косточкой похож на инопланетянина?", a: "Нектарин (его снимают с кожи)", pts: 400 },
                    { q: "Что кричит персик, когда его роняют?", a: "«Мякоть!»", pts: 500 }
                ]
            },
            {
                category: "Экзотика",
                questions: [
                    { q: "Что будет, если ананас и манго скрестить с утюгом?", a: "Фруктово-гладильный агрегат", pts: 100 },
                    { q: "Почему киви такой волосатый, но внутри зелёный?", a: "Это его броня для защиты от холода", pts: 200 },
                    { q: "Какая экзотика лучше всех прячется от сборщиков?", a: "Кокос (он падает с дерева и убегает)", pts: 300 },
                    { q: "Что нужно сделать, чтобы папайя раскрыла секрет?", a: "Спросить её об этом в марте", pts: 400 },
                    { q: "Против кого воюет маракуйя, когда её открывают?", a: "Против ложки", pts: 500 }
                ]
            },
            {
                category: "Фруктовые тайны",
                questions: [
                    { q: "Почему яблоко падает на голову, а банан просто лежит?", a: "Яблоко хочет прославиться, а банан ленивец", pts: 100 },
                    { q: "Какой фрукт никогда не бывает одиноким?", a: "Виноград (он всегда в компании)", pts: 200 },
                    { q: "Какой фрукт самый грустный?", a: "Смородина (она всё время краснеет)", pts: 300 },
                    { q: "Какой завтрак самый грустный?", a: "Съесть вишенку без торта", pts: 400 },
                    { q: "Против кого выступают груши?", a: "Против винограда на рынке", pts: 500 }
                ]
            },
            {
                category: "Фруктовый юмор",
                questions: [
                    { q: "Каким фруктом называют неуклюжего человека?", a: "Кислым яблоком", pts: 100 },
                    { q: "Что говорит банан, когда ему плохо?", a: "«Я в кожуре»", pts: 200 },
                    { q: "Как назвать апельсин, у которого отняли мякоть?", a: "Плоский апельсин", pts: 300 },
                    { q: "Почему мандарин весит меньше чем яблоко?", a: "Потому что он легко поддается очистке", pts: 400 },
                    { q: "Какой фрукт защищён лучше всех?", a: "Кокос (у него есть шлем)", pts: 500 }
                ]
            }
        ];

        let totalScore = 0;
        let currentQuestion = null;
        let currentCell = null;

        function initBoard() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';
            gameData.forEach(cat => {
                const header = document.createElement('div');
                header.className = 'header';
                header.textContent = cat.category;
                board.appendChild(header);
            });

            for (let ptsIndex = 0; ptsIndex < 5; ptsIndex++) {
                gameData.forEach((cat, catIndex) => {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.textContent = cat.questions[ptsIndex].pts;
                    cell.onclick = () => openQuestion(catIndex, ptsIndex, cell);
                    board.appendChild(cell);
                });
            }
        }

        function openQuestion(catIndex, ptsIndex, cell) {
            currentQuestion = gameData[catIndex].questions[ptsIndex];
            currentCell = cell;
            
            document.getElementById('modalCategory').textContent = gameData[catIndex].category;
            document.getElementById('modalPrice').textContent = currentQuestion.pts + " очков";
            document.getElementById('modalContent').textContent = currentQuestion.q;
            
            const btn = document.getElementById('modalBtn');
            btn.textContent = "Показать ответ";
            btn.onclick = showAnswer;
            
            document.getElementById('modalOverlay').style.display = 'flex';
            setTimeout(() => document.querySelector('.modal').classList.add('show'), 10);
        }

        function showAnswer() {
            if (!currentQuestion) return;
            document.getElementById('modalContent').textContent = "ОТВЕТ: " + currentQuestion.a;
            
            const btn = document.getElementById('modalBtn');
            btn.textContent = "Верно! + " + currentQuestion.pts;
            btn.onclick = awardPoints;
        }

        function awardPoints() {
            totalScore += currentQuestion.pts;
            document.getElementById('totalScore').textContent = totalScore;
            
            currentCell.classList.add('answered');
            currentCell.onclick = null;
            closeModal();
        }

        function closeModal() {
            document.querySelector('.modal').classList.remove('show');
            document.getElementById('modalOverlay').style.display = 'none';
            setTimeout(() => { currentQuestion = null; currentCell = null; }, 300);
        }

        window.onload = initBoard;
    </script>
</body>
</html>
